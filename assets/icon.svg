<!-- Package icon source. NuGet needs a raster file, so icon.png is what actually ships;
     this is the editable original. Two sheets for the plural in "Pages", a title rule and
     ascending bars for the report on them, in the same #1a66c2 the designer uses as its
     accent — so the package art and the tool agree. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
    <rect x="0" y="0" width="128" height="128" rx="28" fill="#1a66c2"/>
    <rect x="44" y="22" width="58" height="64" rx="6" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="26" y="38" width="58" height="64" rx="6" fill="#ffffff"/>
    <rect x="36" y="48" width="26" height="4" rx="2" fill="#1a66c2" fill-opacity="0.45"/>
    <rect x="36" y="78" width="8" height="14" rx="2" fill="#1a66c2"/>
    <rect x="51" y="68" width="8" height="24" rx="2" fill="#1a66c2"/>
    <rect x="66" y="58" width="8" height="34" rx="2" fill="#1a66c2"/>
</svg>
